<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>رفع نتيجة تحليل - كيور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Same palette as the app's tailwind `medical` theme. */
    :root { --bg:#F8FAFC; --card:#FFFFFF; --border:#E2E8F0; --primary:#0891B2; --text:#0F172A; --muted:#475569;
            --ok:#059669; --okBg:#D1FAE5; --err:#DC2626; --errBg:#FEE2E2; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); }
    header { background:linear-gradient(135deg,#0891B2,#0E7490,#164E63); color:#fff; padding:28px 16px 64px; text-align:center;
             border-bottom-left-radius:40px; border-bottom-right-radius:40px; }
    header h1 { margin:0; font-size:24px; }
    header p { margin:6px 0 0; opacity:.9; }
    main { max-width:520px; margin:-40px auto 24px; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:24px; padding:22px; box-shadow:0 8px 24px rgba(0,0,0,.06); }
    label { display:block; font-weight:600; margin:14px 0 6px; }
    input[type=text] { width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:12px; font:inherit; background:#F8FAFC; }
    .file { border:2px dashed var(--border); border-radius:16px; padding:18px; text-align:center; cursor:pointer; color:var(--muted); }
    .file.has { border-color:var(--primary); color:var(--primary); font-weight:600; }
    button { width:100%; margin-top:20px; font:inherit; font-weight:700; font-size:17px; border:0; border-radius:14px; padding:14px; cursor:pointer;
             background:linear-gradient(90deg,#0891B2,#0E7490); color:#fff; }
    button:disabled { opacity:.5; cursor:default; }
    .patient { background:#CFFAFE; border-radius:14px; padding:12px 14px; }
    .patient strong { font-size:18px; }
    .msg { margin-top:14px; padding:12px; border-radius:12px; font-weight:600; text-align:center; }
    .msg.err { background:var(--errBg); color:var(--err); } .msg.ok { background:var(--okBg); color:var(--ok); }
    .hidden { display:none; }
    .note { color:var(--muted); font-size:13px; margin-top:12px; text-align:center; }
  </style>
</head>
<body>
  <header>
    <h1>رفع نتيجة تحليل</h1>
    <p>كيور - بوابة المرضى</p>
  </header>
  <main>
    <div class="card">
      <div id="loading">جارٍ التحقق من الرابط…</div>
      <div id="msg" class="msg hidden"></div>

      <form id="form" class="hidden">
        <div class="patient">المريض: <strong id="patientName"></strong></div>
        <label for="labName">اسم المختبر</label>
        <input id="labName" type="text" autocomplete="organization" required maxlength="120" />
        <label for="testName">اسم التحليل</label>
        <input id="testName" type="text" placeholder="مثال: CBC" required maxlength="120" />
        <label>ملف النتيجة (PDF)</label>
        <div id="drop" class="file" tabindex="0" role="button">اضغط لاختيار ملف PDF</div>
        <input id="pdf" type="file" accept="application/pdf" class="hidden" />
        <button id="send" type="submit">إرسال النتيجة للمريض</button>
        <p class="note">الرابط صالح لإرسال نتيجة واحدة فقط.</p>
      </form>
    </div>
  </main>

  <script>
    const API = location.origin + '/api/lab/link/';
    const code = new URLSearchParams(location.search).get('t') || '';
    const $ = id => document.getElementById(id);

    function show(text, ok) {
      const m = $('msg');
      m.textContent = text;
      m.className = 'msg ' + (ok ? 'ok' : 'err');
    }

    async function api(method, body) {
      const res = await fetch(API + encodeURIComponent(code), {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.success === false) {
        const m = data.message;
        throw new Error(Array.isArray(m) ? m.join('، ') : (m || 'حدث خطأ، حاول مجدداً'));
      }
      return data.data;
    }

    try { $('labName').value = localStorage.getItem('labName') || ''; } catch {}

    (async () => {
      try {
        if (!code) throw new Error('الرابط ناقص، اطلب من المريض رابطاً جديداً');
        const info = await api('GET');
        $('patientName').textContent = info.patientName || '—';
        $('form').classList.remove('hidden');
      } catch (e) { show(e.message); }
      $('loading').classList.add('hidden');
    })();

    $('drop').onclick = () => $('pdf').click();
    $('drop').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') $('pdf').click(); };
    $('pdf').onchange = () => {
      const file = $('pdf').files[0];
      $('drop').textContent = file ? file.name : 'اضغط لاختيار ملف PDF';
      $('drop').classList.toggle('has', Boolean(file));
    };

    const toDataUrl = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    $('form').onsubmit = async e => {
      e.preventDefault();
      const file = $('pdf').files[0];
      if (!file) return show('اختر ملف PDF');
      if (file.type !== 'application/pdf') return show('الملف يجب أن يكون PDF');
      if (file.size > 14 * 1024 * 1024) return show('حجم الملف كبير (الحد 14 ميغابايت)');
      $('send').disabled = true;
      $('send').textContent = 'جارٍ الإرسال…';
      try {
        const labName = $('labName').value.trim();
        await api('POST', { labName, testName: $('testName').value.trim(), pdf: await toDataUrl(file) });
        try { localStorage.setItem('labName', labName); } catch {}
        $('form').classList.add('hidden');
        show('تم إرسال النتيجة للمريض. شكراً لك.', true);
      } catch (err) {
        show(err.message);
        $('send').disabled = false;
        $('send').textContent = 'إرسال النتيجة للمريض';
      }
    };
  </script>
</body>
</html>
